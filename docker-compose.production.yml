name: express-intelligence-production

x-api-environment: &api-environment
  ENVIRONMENT: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-express_intelligence}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  STORAGE_ROOT: /data/source-files
  MAX_FILE_BYTES: ${MAX_FILE_BYTES:-500000000000}
  STORAGE_RESERVE_BYTES: ${STORAGE_RESERVE_BYTES:-100000000000}
  MAX_ACTIVE_UPLOADS: ${MAX_ACTIVE_UPLOADS:-2}
  MAX_CHUNK_BYTES: ${MAX_CHUNK_BYTES:-67108864}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
  UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-120}
  REQUIRE_API_KEY: "false"
  ALLOWED_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
  TRUSTED_HOSTS: ${APP_DOMAIN},api,localhost,127.0.0.1
  DB_POOL_SIZE: ${DB_POOL_SIZE:-20}

services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/secrets/caddy-users:/run/secrets/caddy-users:ro
      - ${EXPRESS_DATA_ROOT:?set EXPRESS_DATA_ROOT}/caddy-data:/data
      - ${EXPRESS_DATA_ROOT}/caddy-config:/config
      - ${EXPRESS_DATA_ROOT}/logs/caddy:/var/log/caddy
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]

  frontend:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
    expose: ["3000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment: *api-environment
    expose: ["8000"]
    volumes:
      - ${EXPRESS_DATA_ROOT}/source-files:/data/source-files
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  worker:
    build: ./apps/api
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - ${EXPRESS_DATA_ROOT}/source-files:/data/source-files
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      replicas: ${WORKER_REPLICAS:-4}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-express_intelligence}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${EXPRESS_DATA_ROOT}/postgres:/var/lib/postgresql/data
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ${EXPRESS_DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETGID", "SETUID"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-express_intelligence}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${EXPRESS_BACKUP_ROOT:?set EXPRESS_BACKUP_ROOT}:/backups
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    command: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
